name : deploy React vite to Github pages
on :
  push:
    branches :
      -master
workflow_dispatch:

permissions:
    contents: read
    pages : write
    id-token : write
jobs: 
build:
   runs-on:ubuntu-latest
steps:
 -name : checkout
  uses : actions/checkout@v4
 -name : setup node    
  uses : actions/setup-node@v4
  
  with: node-version:20
      cache:npm
      
      -name:install dependencies
      run:npm ci
      -name :build
      run:npm run build
      
      -name: upload artifact
      uses:actions/upload-pages-artifact@v3
      with:
      path:./dist
      
      deploy:
      environment:
      name:github-pages
      url:${{steps.deployment.outputs.page-url}}
      runs-on:ubuntu-latest
      needs:build

      setup:
      -name:deploy to github pages
      id: deployment
      uses:actions/deploy-pages@v4
